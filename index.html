<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>疾风卡丁车 — PopKart 风格竞速 (真3D)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #10131c; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; background: #000; border-radius: 6px; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  canvas#game3d { position: absolute; top: 0; left: 0; display: block; border-radius: 6px; }
  canvas#game { position: absolute; top: 0; left: 0; display: block; background: transparent; pointer-events: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; border-radius: 6px; }
  #menu { background: linear-gradient(160deg, #2c7ef0 0%, #79c4ff 45%, #bfe9ff 100%); }
  #menu h1 { font-size: 64px; color: #fff; letter-spacing: 6px; font-weight: 900;
    text-shadow: 0 4px 0 #1b56b0, 0 8px 18px rgba(0,0,60,.45); transform: skewX(-6deg); }
  #menu h2 { font-size: 18px; color: #eaf6ff; margin: 6px 0 26px; letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,60,.4); }
  .panel { background: rgba(255,255,255,.92); border-radius: 16px; padding: 18px 26px;
    box-shadow: 0 10px 30px rgba(10,40,120,.35); margin-bottom: 14px; text-align: center; }
  .panel .label { font-size: 13px; color: #4a6a9a; font-weight: 700; margin-bottom: 8px; letter-spacing: 2px; }
  .swatches { display: flex; gap: 10px; justify-content: center; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .12s; }
  .swatch:hover { transform: scale(1.15); }
  .swatch.sel { border-color: #ffd820; transform: scale(1.18); box-shadow: 0 0 0 3px #ff9c00, 0 2px 6px rgba(0,0,0,.3); }
  .tracks { display: flex; gap: 12px; }
  .trackBtn { padding: 10px 20px; border-radius: 12px; border: 3px solid transparent; cursor: pointer;
    font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .trackBtn.t0 { background: linear-gradient(#57c84d, #2e9e3e); }
  .trackBtn.t1 { background: linear-gradient(#6fc7f2, #3a8fd6); }
  .trackBtn.t2 { background: linear-gradient(#f0b050, #d68a2a); }
  .trackBtn.sel { border-color: #ffd820; box-shadow: 0 0 0 3px #ff9c00, 0 4px 0 rgba(0,0,0,.25); }
  #startBtn { margin-top: 10px; font-size: 26px; font-weight: 900; letter-spacing: 6px; color: #fff;
    background: linear-gradient(#ffb020, #ff7a00); border: none; border-radius: 40px; padding: 14px 64px;
    cursor: pointer; box-shadow: 0 6px 0 #c05500, 0 12px 24px rgba(120,40,0,.4); transition: transform .1s; }
  #startBtn:hover { transform: translateY(-2px) scale(1.03); }
  #startBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c05500; }
  .help { margin-top: 18px; color: #124a8f; font-size: 13px; background: rgba(255,255,255,.75);
    border-radius: 10px; padding: 8px 18px; line-height: 1.9; }
  .help b { background: #124a8f; color: #fff; border-radius: 5px; padding: 1px 7px; font-size: 12px; margin: 0 2px; }
  #result { background: rgba(8, 14, 34, .78); display: none; backdrop-filter: blur(3px); }
  #result .card { background: linear-gradient(#ffffff, #eaf2ff); border-radius: 18px; padding: 26px 40px;
    min-width: 420px; box-shadow: 0 16px 50px rgba(0,0,0,.5); text-align: center; }
  #result h3 { font-size: 30px; color: #1b56b0; letter-spacing: 4px; margin-bottom: 14px; }
  #result table { width: 100%; border-collapse: collapse; font-size: 16px; }
  #result td, #result th { padding: 7px 10px; }
  #result tr.me { background: #ffe9a8; border-radius: 8px; font-weight: 800; }
  #result tr:not(:last-child) { border-bottom: 1px dashed #b8c8e8; }
  #result .btns { margin-top: 18px; display: flex; gap: 12px; justify-content: center; }
  #result button { font-size: 17px; font-weight: 800; color: #fff; border: none; border-radius: 24px;
    padding: 10px 30px; cursor: pointer; letter-spacing: 2px; }
  #againBtn { background: linear-gradient(#ffb020, #ff7a00); box-shadow: 0 4px 0 #c05500; }
  #menuBtn2 { background: linear-gradient(#7f95b8, #5a6f92); box-shadow: 0 4px 0 #3d4d6a; }
  #pause { background: rgba(8, 14, 34, .6); display: none; }
  #pause .card { background: #fff; border-radius: 16px; padding: 24px 40px; text-align: center; }
  #pause h3 { color: #1b56b0; margin-bottom: 14px; letter-spacing: 4px; }
  #pause button { display: block; width: 220px; margin: 8px auto; font-size: 16px; font-weight: 800;
    color: #fff; border: none; border-radius: 22px; padding: 10px; cursor: pointer; letter-spacing: 2px;
    background: linear-gradient(#4a9df0, #2a6fd0); box-shadow: 0 4px 0 #1a4a9a; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game3d" width="960" height="540"></canvas>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="menu" class="overlay">
    <h1>疾风卡丁车</h1>
    <h2>—— PopKart 风格 · 真 3D 竞速模式 ——</h2>
    <div class="panel">
      <div class="label">车 身 颜 色</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="panel">
      <div class="label">选 择 赛 道</div>
      <div class="tracks">
        <button class="trackBtn t0 sel" data-t="0">🌳 绿荫村庄</button>
        <button class="trackBtn t1" data-t="1">❄️ 冰封雪谷</button>
        <button class="trackBtn t2" data-t="2">🌵 黄金沙城</button>
      </div>
    </div>
    <button id="startBtn">开始比赛</button>
    <div class="help">
      <b>↑</b>加速　<b>↓</b>刹车　<b>← →</b>转向　<b>Shift</b>漂移集气　<b>Ctrl</b>氮气喷射　<b>Esc</b>暂停<br>
      漂移积攒集气条，攒满获得 N₂O！漂移结束瞬间接喷射可触发 <span style="color:#ff7a00;font-weight:800">双喷</span>！
    </div>
  </div>
  <div id="result" class="overlay"><div class="card">
    <h3 id="resultTitle">比赛结束</h3>
    <table id="resultTable"></table>
    <div class="btns">
      <button id="againBtn">再来一局</button>
      <button id="menuBtn2">回主菜单</button>
    </div>
  </div></div>
  <div id="pause" class="overlay"><div class="card">
    <h3>暂 停</h3>
    <button id="resumeBtn">继续比赛</button>
    <button id="restartBtn">重新开始</button>
    <button id="menuBtn">回主菜单</button>
  </div></div>
</div></div>
<script src="lib/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
